<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>4l3a.duckdns.org</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 40rem;
      margin: 4rem auto;
      padding: 0 1rem;
      line-height: 1.5;
    }
    code { background: #f0f0f0; padding: 0.1rem 0.3rem; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Hello from the Pi</h1>
  <p>This page is served by a C++ server (cpp-httplib) running on a Raspberry Pi,
     behind Caddy for TLS.</p>
  <p>Every time this page loads, the server logs the visit and runs
     <code>onClientVisit()</code> in <code>main.cpp</code> — that's the hook
     to wire up any custom action.</p>
  <p id="status">Checking status…</p>

  <script>
    fetch('/api/status')
      .then(r => r.json())
      .then(d => {
        document.getElementById('status').textContent =
          `Server status: ${d.status} — total visits so far: ${d.visits}`;
      })
      .catch(() => {
        document.getElementById('status').textContent = 'Could not reach /api/status';
      });
  </script>
</body>
</html>
