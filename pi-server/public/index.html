<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>4l3a.duckdns.org</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 40rem;
      margin: 4rem auto;
      padding: 0 1rem;
      line-height: 1.5;
    }
    code { background: #f0f0f0; padding: 0.1rem 0.3rem; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>HAZARDOUS ÉDITORIAL</h1>
  <p>WELCOME TO THE HAZARDOUS LABOTORY</p>
  <p id="status">Checking status…</p>
<button id="printBtn">Print on Minitel</button>
<p id="printResult"></p>

<script>
  document.getElementById('printBtn').addEventListener('click', () => {
    fetch('/api/minitel')
      .then(r => r.json())
      .then(d => {
        document.getElementById('printResult').textContent = 'Sent: ' + d.status;
      })
      .catch(() => {
        document.getElementById('printResult').textContent = 'Failed to reach server';
      });
  });
</script>

  <script>
    fetch('/api/status')
      .then(r => r.json())
      .then(d => {
        document.getElementById('status').textContent =
          `Server status: ${d.status} — total visits so far: ${d.visits}`;
      })
      .catch(() => {
        document.getElementById('status').textContent = 'Could not reach /api/status';
      });
  </script>
</body>
</html>
