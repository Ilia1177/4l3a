<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>4l3a.duckdns.org</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 40rem;
      margin: 4rem auto;
      padding: 0 1rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>HAZARDOUS ÉDITORIAL</h1>
  <p>WELCOME TO THE HAZARDOUS LABOTORY</p>
  <p id="status">Checking status…</p>
  <div>
  <input type="text" id="passcodeInput" placeholder="Enter passcode" />
  <button id="passcodeBtn">Entrer the HAZARDOUS Maze</button>
  <p id="passcodeResult"></p>
  </div>

  <button id="printBtn">Get your code</button>
  <p id="printResult"></p>
<p id="sessionStatus">Connecting…</p>

<script>
  let sessionToken = null;

  function join() {
    fetch('/api/minitel/join', { method: 'POST' })
      .then(r => r.json().then(d => ({ ok: r.ok, d })))
      .then(({ ok, d }) => {
        if (ok) {
          sessionToken = d.token;
          document.getElementById('sessionStatus').textContent = 'Laboratoire disponible !';
        } else {
          document.getElementById('sessionStatus').textContent = 'Someone else is playing — try again shortly.';
        }
      });
  }

  function callMinitel(path, options = {}) {
    if (!sessionToken) return Promise.reject('no session');
    return fetch(path, {
      ...options,
      headers: { ...(options.headers || {}), 'X-Session-Token': sessionToken }
    });
  }

  // Release the session when the tab closes, if possible.
  window.addEventListener('beforeunload', () => {
    if (sessionToken) {
      navigator.sendBeacon('/api/minitel/leave', new Blob());
    }
  });

  join();
</script>
<script>
  document.getElementById('passcodeBtn').addEventListener('click', () => {
    const code = document.getElementById('passcodeInput').value;
    if (!code) return;

    <!-- fetch('/api/minitel/hazardousLab', { -->
    callMinitel('/api/minitel/hazardousLab', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ code })
    })
      .then(r => r.json())
      .then(d => {
        document.getElementById('passcodeResult').textContent =
          d.status ? 'Sent: ' + d.status : 'Error: ' + d.error;
      })
      .catch(() => {
        document.getElementById('passcodeResult').textContent = 'Failed to reach server';
      });
  });
</script>

<script>
  document.getElementById('printBtn').addEventListener('click', () => {
    <!-- fetch('/api/minitel/printcode') -->
    callMinitel('/api/minitel/printcode')
      .then(r => r.json())
      .then(d => {
        document.getElementById('printResult').textContent = 'Sent: ' + d.status;
      })
      .catch(() => {
        document.getElementById('printResult').textContent = 'Failed to reach server';
      });
  });
</script>

<script>
  fetch('/api/status')
    .then(r => r.json())
    .then(d => {
      document.getElementById('status').textContent =
        `Server status: ${d.status} — total visits so far: ${d.visits}`;
    })
    .catch(() => {
      document.getElementById('status').textContent = 'Could not reach /api/status';
    });
</script>

</body>
</html>
